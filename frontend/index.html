<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moderador de comentarios</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    textarea { width: 100%; min-height: 110px; padding: .6rem; font: inherit; box-sizing: border-box; }
    button { margin-top: .6rem; padding: .6rem 1.2rem; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .tarjeta { margin-top: 1rem; padding: 1rem; border-radius: 8px; border: 2px solid #999; }
    .positivo { border-color: #2e7d32; background: #e8f5e9; }
    .neutro   { border-color: #9e9e9e; background: #f5f5f5; }
    .negativo { border-color: #c62828; background: #ffebee; }
    .error { color: #c62828; margin-top: .8rem; }
    li { margin: .4rem 0; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Moderador de comentarios</h1>
  <form id="formulario">
    <label for="texto">Escribe el comentario:</label>
    <textarea id="texto" maxlength="1000" required></textarea>
    <button id="boton" type="submit">Analizar</button>
  </form>

  <p id="error" class="error" hidden></p>
  <div id="resultado" class="tarjeta" hidden></div>

  <h2>Últimos análisis</h2>
  <ul id="historial"></ul>

  <script>
    // URL pública del backend (sin "/" al final)
    const API_URL = 'https://examen-desarrolloweb-practica.onrender.com';

    const ETIQUETAS = { positivo: 'Positivo', neutro: 'Neutro', negativo: 'Negativo' };
    const $ = (id) => document.getElementById(id);

    function pintarResultado(r) {
      const caja = $('resultado');
      caja.className = `tarjeta ${r.etiqueta}`;
      caja.hidden = false;
      caja.replaceChildren();
      const titulo = document.createElement('strong');
      titulo.textContent = `${ETIQUETAS[r.etiqueta] ?? r.etiqueta} (${Math.round(r.confianza * 100)}% de confianza)`;
      const detalle = document.createElement('p');
      detalle.textContent = `“${r.comentario}”`;
      caja.append(titulo, detalle);
    }

    function pintarHistorial(lista) {
      $('historial').replaceChildren(
        ...lista.map((r) => {
          const li = document.createElement('li');
          li.textContent = `${ETIQUETAS[r.etiqueta] ?? r.etiqueta}: ${r.comentario}`;
          return li;
        })
      );
    }

    async function cargarHistorial() {
      try {
        const res = await fetch(`${API_URL}/api/historial`);
        if (res.ok) pintarHistorial(await res.json());
      } catch { /* el historial es opcional */ }
    }

    $('formulario').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('error').hidden = true;
      $('boton').disabled = true;
      $('boton').textContent = 'Analizando…';
      try {
        const res = await fetch(`${API_URL}/api/analizar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comentario: $('texto').value }),
        });
        const datos = await res.json();
        if (!res.ok) throw new Error(datos.error || 'Error desconocido');
        pintarResultado(datos);
        cargarHistorial();
      } catch (err) {
        $('error').textContent = err.message;
        $('error').hidden = false;
      } finally {
        $('boton').disabled = false;
        $('boton').textContent = 'Analizar';
      }
    });

    cargarHistorial();
  </script>
</body>
</html>
